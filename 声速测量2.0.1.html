<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>声速测量虚拟仿真 · 进阶版（扩量程）</title>
    <style>
        :root {
            --bg: #0f1219;
            --panel: #1a1e26;
            --card: #21252f;
            --border: #2e3440;
            --text: #d8dce3;
            --text2: #9aa0ad;
            --accent: #3b8cff;
            --green: #3fb950;
            --gold: #e2b04a;
            --red: #f85149;
            --scope-bg: #03050a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            user-select: none;
        }
        .app { width:100%; max-width:1400px; display:flex; flex-direction:column; gap:10px; }
        .header {
            display:flex; align-items:center; gap:16px; flex-wrap:wrap;
            background:var(--panel); border-radius:14px; padding:12px 20px; border:1px solid var(--border);
        }
        .header .title { font-size:1.2em; font-weight:700; display:flex; align-items:center; gap:6px; }
        .method-tabs { display:flex; gap:4px; background:var(--card); border-radius:10px; padding:4px; border:1px solid var(--border); }
        .method-tabs button {
            padding:8px 16px; border:none; background:transparent; color:var(--text2); border-radius:8px; cursor:pointer; font-weight:500; transition:0.2s;
        }
        .method-tabs button.active { background:var(--accent); color:#fff; font-weight:600; }
        .temp-ctrl { display:flex; align-items:center; gap:8px; margin-left:auto; }
        .temp-ctrl input[type=range] { width:100px; }
        .temp-ctrl span { font-weight:600; color:var(--gold); min-width:55px; }

        .main-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        @media (max-width:1100px) { .main-grid { grid-template-columns:1fr; } }

        .panel {
            background:var(--panel); border-radius:14px; border:1px solid var(--border); padding:14px;
            display:flex; flex-direction:column; gap:10px;
        }
        .panel-title { font-weight:600; display:flex; align-items:center; gap:8px; }

        .instruments {
            display:flex; flex-wrap:wrap; gap:10px; background:var(--card);
            padding:10px 14px; border-radius:12px; border:1px solid var(--border); align-items:center;
        }
        .inst-group {
            display:flex; align-items:center; gap:6px; background:#161a22;
            padding:6px 10px; border-radius:8px; border:1px solid #2c3140;
        }
        .inst-group label { font-size:0.8em; color:var(--text2); white-space:nowrap; }
        .inst-group input[type=range] { width:80px; accent-color:var(--accent); }
        .inst-group input[type=number] {
            width:80px; background:#0b0e14; border:1px solid var(--border); color:#fff; padding:4px 6px; border-radius:4px;
            text-align:center; font-size:0.9em;
        }
        .inst-group select {
            background:#0b0e14; border:1px solid var(--border); color:#fff; padding:4px 8px; border-radius:4px;
        }

        .scope-container {
            position:relative; background:var(--scope-bg); border-radius:10px; border:3px solid #2c3140;
            overflow:hidden; aspect-ratio:1.5/1; min-height:260px; box-shadow:inset 0 0 30px rgba(0,0,0,0.6);
        }
        .scope-container canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
        .scope-overlay {
            position:absolute; top:6px; left:10px; font-size:0.7em; color:#5a7a5a; font-family:monospace; pointer-events:none;
        }
        .scope-hint {
            position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:0.75em; color:#ff9;
            background:rgba(0,0,0,0.7); padding:4px 14px; border-radius:20px; pointer-events:none; opacity:0; transition:0.3s;
        }
        .scope-hint.show { opacity:1; }

        .position-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .pos-display {
            background:#000; color:#ff8800; font-family:monospace; font-size:1.5em; font-weight:bold; padding:6px 14px;
            border-radius:8px; border:2px solid #333; min-width:120px; text-align:center;
        }
        .slider-main { flex:1; min-width:180px; }

        button {
            padding:8px 14px; background:#2d333f; border:1px solid #444; color:#fff; border-radius:8px; cursor:pointer; font-weight:500; transition:0.2s;
        }
        button:hover { background:#3c4455; }
        button.accent { background:var(--accent); border-color:var(--accent); font-weight:600; }
        button.accent:disabled { opacity:0.5; cursor:not-allowed; }

        .data-table-wrap { max-height:280px; overflow:auto; border-radius:8px; border:1px solid var(--border); }
        table { width:100%; border-collapse:collapse; font-size:0.8em; }
        th, td { padding:6px 8px; text-align:center; border-bottom:1px solid #2a2e38; }
        th { background:#1c1f28; color:#aaa; position:sticky; top:0; }
        .highlight { color:#ffcc00; font-weight:600; }
        .ref { color:#666; }

        .results { display:flex; flex-wrap:wrap; gap:8px; }
        .res-card {
            flex:1; min-width:100px; background:var(--card); border-radius:10px; padding:10px; text-align:center; border:1px solid var(--border);
        }
        .res-card .label { font-size:0.75em; color:var(--text2); }
        .res-card .value { font-size:1.2em; font-weight:700; }
        .gold { color:var(--gold); } .green { color:var(--green); }

        .toast {
            position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#2d3748; color:#fff; padding:10px 24px;
            border-radius:30px; z-index:999; opacity:0; transition:0.3s; pointer-events:none; box-shadow:0 6px 20px rgba(0,0,0,0.5);
        }
        .toast.show { opacity:1; top:30px; }
        .toast.success { background:#1e4620; }
        .toast.warning { background:#5e4800; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="title">🔬 声速测量 · 进阶仿真</div>
        <div class="method-tabs" id="methodTabs">
            <button data-method="resonance" class="active">驻波共振法</button>
            <button data-method="phase">相位比较法</button>
            <button data-method="pulse">时差法(脉冲)</button>
        </div>
        <div class="temp-ctrl">
            <span>🌡️ 温度</span>
            <input type="range" id="tempSlider" min="0" max="50" value="26.0" step="0.1">
            <span id="tempValue">26.0°C</span>
            <span style="color:var(--text2);">理论声速 <strong id="theorySpeed">346.9</strong> m/s</span>
        </div>
    </div>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-title"><span style="color:var(--accent);">📡</span> 实验仪器与示波器</div>
            <div class="instruments" id="instPanel">
                <div class="inst-group">
                    <label>📶 频率 (kHz)</label>
                    <input type="range" id="freqSlider" min="20" max="100" value="37.004" step="0.001">
                    <input type="number" id="freqInput" value="37.004" step="0.001" min="20" max="100">
                </div>
                <div class="inst-group">
                    <label>🔊 发射强度</label>
                    <input type="range" id="ampSlider" min="0.1" max="2.0" value="1.0" step="0.1">
                </div>
                <div class="inst-group" id="modeGroup">
                    <label>⚡ 模式</label>
                    <select id="waveMode">
                        <option value="continuous">连续波</option>
                        <option value="pulse">脉冲</option>
                    </select>
                </div>
                <div class="inst-group" id="triggerGroup">
                    <label>⏱️ 时基 (ms/div)</label>
                    <select id="timeDiv">
                        <option value="0.02">0.02</option>
                        <option value="0.05">0.05</option>
                        <option value="0.1" selected>0.1</option>
                        <option value="0.2">0.2</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>

            <div class="scope-container" id="scopeContainer">
                <canvas id="scopeCanvas"></canvas>
                <div class="scope-overlay">OSCILLOSCOPE <span id="scopeModeText">YT</span></div>
                <div class="scope-hint" id="scopeHint">📌 接近共振点，请记录</div>
            </div>

            <div class="position-bar">
                <div class="pos-display"><span id="posValue">56.52</span> mm</div>
                <button id="btnFineDec" style="font-size:1.4em; padding:4px 12px;">−</button>
                <button id="btnFineInc" style="font-size:1.4em; padding:4px 12px;">+</button>
                <button class="accent" id="btnRecord">📝 记录</button>
                <button id="btnReset">🔄 重置</button>
                <button id="btnAutoMove">🎯 自动寻峰</button>
            </div>
            <div class="slider-main">
                <input type="range" id="positionSlider" min="20" max="150" value="56.52" step="0.01" style="width:100%;">
                <div style="display:flex; justify-content:space-between; font-size:0.65em; color:#555; padding:0 8px;">
                    <span>20</span><span>40</span><span>60</span><span>80</span><span>100</span><span>120</span><span>140</span><span>150 mm</span>
                </div>
            </div>
            <div style="font-size:0.7em; color:#666; text-align:center;">🖱️ 滑块/方向键移动 | 空格记录 | R重置</div>
        </div>

        <div class="panel">
            <div class="panel-title">📋 实验数据 <span id="recordHint" style="font-size:0.7em;color:#888;">需记录12个位置</span></div>
            <div class="data-table-wrap">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="noData" style="text-align:center;color:#555;padding:20px;">📭 暂无数据</div>
            <div class="results" id="resultsRow" style="display:none;">
                <div class="res-card"><div class="label">平均 S/Δt</div><div class="value gold" id="resS">--</div></div>
                <div class="res-card"><div class="label">波长/ΔL</div><div class="value gold" id="resLambda">--</div></div>
                <div class="res-card"><div class="label">测量声速</div><div class="value" id="resSpeed">--</div></div>
                <div class="res-card"><div class="label">误差</div><div class="value green" id="resError">--</div></div>
            </div>
            <div style="font-size:0.75em; color:#666; margin-top:4px;" id="stdNote"></div>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
    (function() {
        // DOM
        const scopeCanvas = document.getElementById('scopeCanvas');
        const scopeCtx = scopeCanvas.getContext('2d');
        const scopeContainer = document.getElementById('scopeContainer');
        const posSlider = document.getElementById('positionSlider');
        const posValue = document.getElementById('posValue');
        const scopeHint = document.getElementById('scopeHint');
        const scopeModeText = document.getElementById('scopeModeText');
        const btnRecord = document.getElementById('btnRecord');
        const btnReset = document.getElementById('btnReset');
        const btnFineDec = document.getElementById('btnFineDec');
        const btnFineInc = document.getElementById('btnFineInc');
        const btnAutoMove = document.getElementById('btnAutoMove');
        const methodBtns = document.querySelectorAll('#methodTabs button');
        const tempSlider = document.getElementById('tempSlider');
        const tempValue = document.getElementById('tempValue');
        const theorySpeedEl = document.getElementById('theorySpeed');
        const freqSlider = document.getElementById('freqSlider');
        const freqInput = document.getElementById('freqInput');
        const ampSlider = document.getElementById('ampSlider');
        const waveMode = document.getElementById('waveMode');
        const timeDivSelect = document.getElementById('timeDiv');
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');
        const noDataDiv = document.getElementById('noData');
        const resultsRow = document.getElementById('resultsRow');
        const recordHint = document.getElementById('recordHint');
        const stdNote = document.getElementById('stdNote');
        const toast = document.getElementById('toast');
        const modeGroup = document.getElementById('modeGroup');
        const triggerGroup = document.getElementById('triggerGroup');

        // 状态
        let method = 'resonance';
        let temperature = 26.0;
        let frequency = 37.004;   // kHz
        let amplitude = 1.0;
        let position = 56.52;     // mm
        let waveType = 'continuous';
        let timeDiv = 0.1;        // ms/div
        let recordedData = [];
        const MAX_RECORDS = 12;

        let scopeW = 0, scopeH = 0;
        const dpr = window.devicePixelRatio || 1;

        // 理论声速 (m/s)
        const calcTheorySpeed = t => 331.45 * Math.sqrt((273.15 + t) / 273.15);
        const getTheorySpeed = () => calcTheorySpeed(temperature);
        // 波长 (mm) = 声速(m/s) / 频率(kHz)  因为 1 m/s = 1 mm/ms, 1 kHz = 1/ms, 所以相除得 mm
        const getWavelength = () => getTheorySpeed() / frequency;

        function getStdValues() {
            const u = getTheorySpeed();
            const lambda = u / frequency;
            if (method === 'resonance') return { s: lambda*3, lambda, speed: u, err: 1.0 };
            if (method === 'phase') return { s: lambda*3, lambda, speed: u, err: 2.1 };
            return { s: 0, lambda: 0, speed: u, err: 0 };
        }

        // Toast
        let toastTimer;
        function showToast(msg, type='') {
            clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.className = 'toast '+type+' show';
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // UI 更新
        function updateHeader() {
            tempValue.textContent = temperature.toFixed(1)+'°C';
            theorySpeedEl.textContent = getTheorySpeed().toFixed(1);
        }
        function updatePositionDisplay() {
            posValue.textContent = position.toFixed(2);
            posSlider.value = position;
        }
        function updateScopeModeLabel() {
            if (method === 'resonance') scopeModeText.textContent = 'YT · 驻波共振';
            else if (method === 'phase') scopeModeText.textContent = 'XY · 李萨如图';
            else scopeModeText.textContent = 'YT · 脉冲时差';
        }
        function updateHint() {
            const half = getWavelength()/2;
            const mod = position % half;
            const dist = Math.min(mod, half-mod);
            if (method === 'pulse') { scopeHint.className='scope-hint'; return; }
            if (dist < 0.1) { scopeHint.textContent='🎯 共振点！请记录'; scopeHint.className='scope-hint show'; }
            else if (dist < 0.5) { scopeHint.textContent='📌 接近共振...'; scopeHint.className='scope-hint show'; }
            else { scopeHint.className='scope-hint'; }
        }

        function updateControlVisibility() {
            if (method === 'pulse') {
                waveMode.value = 'pulse';
                modeGroup.style.display = 'none';
            } else if (method === 'phase') {
                modeGroup.style.display = 'flex';
                waveMode.value = 'continuous';
                waveMode.disabled = true;   // 相位法强制连续波
            } else { // resonance
                modeGroup.style.display = 'flex';
                waveMode.disabled = false;
                if (waveMode.value === 'pulse') waveMode.value = 'continuous';
            }
        }

        // 画布尺寸管理
        function setupCanvasSize(container, canvas, setSize) {
            const observer = new ResizeObserver(entries => {
                for (const entry of entries) {
                    const { width, height } = entry.contentRect;
                    if (width===0||height===0) return;
                    const w = Math.floor(width), h = Math.floor(height);
                    if (w !== canvas.width || h !== canvas.height) {
                        canvas.width = w * dpr;
                        canvas.height = h * dpr;
                        canvas.style.width = w+'px';
                        canvas.style.height = h+'px';
                        setSize(w, h);
                        needsRedraw = true;
                    }
                }
            });
            observer.observe(container);
            const rect = container.getBoundingClientRect();
            if (rect.width>0 && rect.height>0) {
                const w=Math.floor(rect.width), h=Math.floor(rect.height);
                canvas.width = w*dpr; canvas.height = h*dpr;
                canvas.style.width=w+'px'; canvas.style.height=h+'px';
                setSize(w, h);
            }
        }
        setupCanvasSize(scopeContainer, scopeCanvas, (w,h)=>{ scopeW=w; scopeH=h; });

        // 绘制示波器
        function drawScope() {
            if (!scopeW || !scopeH) return;
            const ctx = scopeCtx;
            const w=scopeW, h=scopeH;
            ctx.setTransform(1,0,0,1,0,0);
            ctx.scale(dpr, dpr);
            ctx.clearRect(0,0,w,h);

            const cx=w/2, cy=h/2;
            // 网格
            ctx.strokeStyle='#1a2a1a'; ctx.lineWidth=0.5;
            const gridSize = 30;
            for (let x=gridSize; x<w; x+=gridSize) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
            for (let y=gridSize; y<h; y+=gridSize) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
            ctx.strokeStyle='#2a3a2a'; ctx.lineWidth=0.8;
            ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,h); ctx.moveTo(0,cy); ctx.lineTo(w,cy); ctx.stroke();

            const u = getTheorySpeed();
            const lambda = getWavelength();

            if (method === 'resonance' && waveType === 'continuous') {
                const ampFactor = Math.abs(Math.cos(2*Math.PI*position/lambda));
                const amp = h*0.38 * (0.15 + 0.85*ampFactor) * amplitude;
                ctx.strokeStyle='#33ff66'; ctx.lineWidth=2.5; ctx.shadowColor='#33ff66'; ctx.shadowBlur=8;
                ctx.beginPath();
                for (let px=0; px<w; px++) {
                    const py = cy - amp * Math.sin((px/w)*8*Math.PI);
                    px===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
                }
                ctx.stroke(); ctx.shadowBlur=0;
                ctx.fillStyle='rgba(51,255,102,0.7)'; ctx.font='10px monospace';
                ctx.fillText('振幅: '+(ampFactor*100).toFixed(0)+'%', 10, h-12);
                if (ampFactor>0.95) { ctx.fillStyle='#ffcc00'; ctx.font='bold 12px sans-serif'; ctx.fillText('🔊 共振', cx+40, 25); }
            }
            else if (method === 'phase' && waveType === 'continuous') {
                const phi = (2*Math.PI*position) % (2*Math.PI);
                const amp = Math.min(w,h)*0.38;
                ctx.strokeStyle='#ffcc33'; ctx.lineWidth=2.5; ctx.shadowColor='#ffcc33'; ctx.shadowBlur=10;
                ctx.beginPath();
                for (let i=0; i<=800; i++) {
                    const t = (i/800)*2*Math.PI;
                    const px = cx + amp * Math.cos(t);
                    const py = cy - amp * Math.cos(t + phi);
                    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
                }
                ctx.stroke(); ctx.shadowBlur=0;
                const isLine = Math.abs(phi%Math.PI) < 0.05 || Math.abs(phi%Math.PI - Math.PI) < 0.05;
                ctx.fillStyle = isLine ? '#ffcc00' : 'rgba(255,255,255,0.6)';
                ctx.font='10px monospace';
                ctx.fillText('φ='+((phi*180/Math.PI)%360).toFixed(0)+'°', 10, h-12);
                if (isLine) {
                    ctx.fillStyle='#ffcc00'; ctx.font='bold 12px sans-serif';
                    ctx.fillText('📏 直线', cx+40, 25);
                }
            }
            else if (method === 'pulse' || waveType === 'pulse') {
                const timeWindow = timeDiv * 10;   // 全屏时间 (ms)
                const flightTime = position / u;   // ms
                const pulseWidthMs = 0.02;
                const pulseWidthPx = Math.max(2, (pulseWidthMs / timeWindow) * w);
                const trigX = w * 0.1;
                const recX = trigX + (flightTime / timeWindow) * w;
                ctx.fillStyle='#33ff66'; ctx.shadowColor='#33ff66'; ctx.shadowBlur=6;
                ctx.fillRect(trigX, cy-30, pulseWidthPx, 60);
                ctx.fillStyle='#ffcc33'; ctx.shadowColor='#ffcc33'; ctx.shadowBlur=6;
                ctx.fillRect(recX, cy-30, pulseWidthPx, 60);
                ctx.shadowBlur=0;
                ctx.fillStyle='#33ff66'; ctx.font='9px monospace'; ctx.fillText('CH1 发射', trigX-40, cy-35);
                ctx.fillStyle='#ffcc33'; ctx.fillText('CH2 接收', recX+10, cy-35);
                ctx.fillStyle='#fff'; ctx.font='11px monospace';
                ctx.fillText('Δt = '+flightTime.toFixed(4)+' ms', w-150, 20);
                ctx.fillText('L = '+position.toFixed(2)+' mm', w-150, 40);
            }

            if (method !== 'pulse' && waveType !== 'pulse') {
                const half = lambda/2;
                const mod = position % half;
                if (Math.min(mod, half-mod) < 0.08) {
                    ctx.strokeStyle='rgba(255,200,50,0.6)'; ctx.lineWidth=3; ctx.strokeRect(1,1,w-2,h-2);
                }
            }
        }

        // 表格与计算
        function rebuildTable() {
            if (method === 'pulse') {
                tableHead.innerHTML = '<tr><th>i</th><th>L (mm)</th><th>Δt (ms)</th><th>ΔL (mm)</th><th>ΔΔt (ms)</th><th>u (m/s)</th></tr>';
                tableBody.innerHTML = '';
                for (let i=0; i<MAX_RECORDS; i++) {
                    const rec = i<recordedData.length ? recordedData[i] : null;
                    const dL = (i<6 && recordedData.length>i+6) ? (recordedData[i+6].position - recordedData[i].position).toFixed(2) : '--';
                    const dT = (i<6 && recordedData.length>i+6) ? ((recordedData[i+6].deltaT - recordedData[i].deltaT)).toFixed(4) : '--';
                    const uVal = (dL!=='--' && dT!=='--' && parseFloat(dT)!==0) ? (parseFloat(dL)/parseFloat(dT)).toFixed(1) : '--';
                    tableBody.innerHTML += `<tr>
                        <td>${i+1}</td>
                        <td class="${rec?'highlight':''}">${rec?rec.position.toFixed(2):'--'}</td>
                        <td class="${rec?'highlight':''}">${rec?rec.deltaT.toFixed(4):'--'}</td>
                        <td>${dL}</td><td>${dT}</td><td>${uVal}</td>
                    </tr>`;
                }
            } else {
                tableHead.innerHTML = '<tr><th>i</th><th>L (mm)</th><th>S=L<sub>i+6</sub>-L<sub>i</sub></th><th>λ<sub>i</sub> (mm)</th><th>参考 L</th></tr>';
                tableBody.innerHTML = '';
                const stdPos = Array.from({length:12}, (_,i)=> (i+1)*getWavelength()/2 + (method==='resonance'?44:50));
                for (let i=0; i<MAX_RECORDS; i++) {
                    const rec = i<recordedData.length ? recordedData[i] : null;
                    const sVal = (i<6 && recordedData.length>i+6) ? (recordedData[i+6].position - recordedData[i].position).toFixed(2) : '--';
                    const lambdaVal = sVal!=='--' ? (parseFloat(sVal)/3).toFixed(3) : '--';
                    tableBody.innerHTML += `<tr>
                        <td>${i+1}</td>
                        <td class="${rec?'highlight':''}">${rec?rec.position.toFixed(2):'--'}</td>
                        <td class="${sVal!=='--'?'highlight':''}">${sVal}</td>
                        <td class="${lambdaVal!=='--'?'highlight':''}">${lambdaVal}</td>
                        <td class="ref">${stdPos[i].toFixed(2)}</td>
                    </tr>`;
                }
            }
            noDataDiv.style.display = recordedData.length===0 ? '' : 'none';
            recordHint.textContent = `已记录 ${recordedData.length}/${MAX_RECORDS}`;
        }

        function calculateResults() {
            if (recordedData.length < MAX_RECORDS) { resultsRow.style.display='none'; return; }
            resultsRow.style.display='';
            const uTheory = getTheorySpeed();
            let measuredSpeed, error;
            if (method === 'pulse') {
                const dL = [], dT = [];
                for (let i=0; i<6; i++) {
                    dL.push(recordedData[i+6].position - recordedData[i].position);
                    dT.push(recordedData[i+6].deltaT - recordedData[i].deltaT);
                }
                const avgDL = dL.reduce((a,b)=>a+b,0)/6;
                const avgDT = dT.reduce((a,b)=>a+b,0)/6;
                measuredSpeed = avgDL / avgDT;
                document.getElementById('resS').textContent = avgDT.toFixed(4)+' ms';
                document.getElementById('resLambda').textContent = avgDL.toFixed(2)+' mm';
            } else {
                const sVals = [];
                for (let i=0; i<6; i++) sVals.push(recordedData[i+6].position - recordedData[i].position);
                const sAvg = sVals.reduce((a,b)=>a+b,0)/6;
                const lambdaAvg = sAvg/3;
                measuredSpeed = frequency * lambdaAvg;
                document.getElementById('resS').textContent = sAvg.toFixed(2)+' mm';
                document.getElementById('resLambda').textContent = lambdaAvg.toFixed(3)+' mm';
            }
            error = Math.abs(measuredSpeed - uTheory)/uTheory*100;
            document.getElementById('resSpeed').textContent = measuredSpeed.toFixed(1)+' m/s';
            document.getElementById('resError').textContent = error.toFixed(1)+'%';
            stdNote.innerHTML = `理论声速 ${uTheory.toFixed(1)} m/s，标准误差参考：${method==='resonance'?'1.0%':method==='phase'?'2.1%':'<1%'}`;
        }

        function updateAllData() { rebuildTable(); calculateResults(); }

        // 记录
        function recordCurrent() {
            if (recordedData.length >= MAX_RECORDS) { showToast('已满12组','warning'); return; }
            if (method === 'pulse') {
                const dt = position / getTheorySpeed();
                recordedData.push({ position, deltaT: dt });
            } else {
                recordedData.push({ position });
            }
            updateAllData();
            if (recordedData.length === MAX_RECORDS) {
                btnRecord.disabled = true;
                showToast('🎉 记录完成！','success');
            } else {
                showToast(`✅ 已记录第 ${recordedData.length} 个点`,'success');
            }
        }

        function resetData() {
            recordedData = [];
            btnRecord.disabled = false;
            updateAllData();
            resultsRow.style.display='none';
            showToast('🔄 数据已重置');
        }

        // 位置控制
        function setPosition(val) {
            position = Math.max(20, Math.min(150, val));
            updatePositionDisplay();
            updateHint();
            needsRedraw = true;
        }

        function autoMoveToPeak() {
            if (method === 'pulse') return;
            const half = getWavelength()/2;
            const nextPeak = Math.ceil(position / half) * half;
            if (nextPeak <= position) setPosition(nextPeak + half);
            else setPosition(nextPeak);
            showToast('已移动到共振点附近','');
        }

        // 事件绑定
        posSlider.addEventListener('input', ()=> setPosition(parseFloat(posSlider.value)));
        btnFineDec.addEventListener('click', ()=> setPosition(position-0.02));
        btnFineInc.addEventListener('click', ()=> setPosition(position+0.02));
        btnRecord.addEventListener('click', recordCurrent);
        btnReset.addEventListener('click', resetData);
        btnAutoMove.addEventListener('click', autoMoveToPeak);

        tempSlider.addEventListener('input', ()=>{
            temperature = parseFloat(tempSlider.value);
            updateHeader();
            updateHint();
            needsRedraw = true;
            updateAllData();
        });
        freqSlider.addEventListener('input', ()=>{
            frequency = parseFloat(freqSlider.value);
            freqInput.value = frequency;
            updateHint();
            needsRedraw = true;
            updateAllData();
        });
        freqInput.addEventListener('change', ()=>{
            let v = parseFloat(freqInput.value);
            if (isNaN(v)) v=37;
            frequency = Math.min(100, Math.max(20, v));
            freqSlider.value = frequency;
            freqInput.value = frequency;
            updateHint(); needsRedraw=true; updateAllData();
        });
        ampSlider.addEventListener('input', ()=>{ amplitude=parseFloat(ampSlider.value); needsRedraw=true; });
        waveMode.addEventListener('change', ()=>{ waveType=waveMode.value; needsRedraw=true; });
        timeDivSelect.addEventListener('change', ()=>{ timeDiv=parseFloat(timeDivSelect.value); needsRedraw=true; });

        methodBtns.forEach(btn=>{
            btn.addEventListener('click', ()=>{
                methodBtns.forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                const newMethod = btn.dataset.method;
                if (newMethod !== method) {
                    method = newMethod;
                    resetData();
                    updateScopeModeLabel();
                    updateControlVisibility();
                    updateHint();
                    if (method === 'resonance') setPosition(52.30);
                    else if (method === 'phase') setPosition(56.52);
                    else setPosition(60.0);
                    showToast('方法切换：'+btn.textContent,'');
                }
            });
        });

        document.addEventListener('keydown', e=>{
            if (e.target.tagName==='INPUT' && e.target.type!=='range' && e.target.type!=='number') return;
            switch(e.key) {
                case 'ArrowLeft': e.preventDefault(); setPosition(position-0.05); break;
                case 'ArrowRight': e.preventDefault(); setPosition(position+0.05); break;
                case ' ': e.preventDefault(); if(!btnRecord.disabled) recordCurrent(); break;
                case 'r': case 'R': if(!e.ctrlKey&&!e.metaKey){ e.preventDefault(); resetData(); } break;
            }
        });

        // 动画循环
        let needsRedraw = true;
        function loop() {
            if (needsRedraw) { drawScope(); needsRedraw=false; }
            requestAnimationFrame(loop);
        }

        // 初始化
        function init() {
            updateHeader();
            updatePositionDisplay();
            updateScopeModeLabel();
            updateControlVisibility();
            updateHint();
            updateAllData();
            freqInput.value = frequency;
            freqSlider.value = frequency;
            tempSlider.value = temperature;
            waveMode.value = 'continuous';
            timeDivSelect.value = '0.1';
            setPosition(56.52);
        }
        init();
        requestAnimationFrame(loop);
        console.log('🔬 进阶声速仿真已启动（量程扩大，李萨如图&控制逻辑修复）');
    })();
</script>
</body>
</html>
